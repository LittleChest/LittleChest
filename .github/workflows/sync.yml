name: 同步上游
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - name: Sync Docker
        env:
          OPENLIST_WEBHOOK: ${{ secrets.OPENLIST_WEBHOOK }}
        run: |
          if [ -z "$OPENLIST_WEBHOOK" ]
          then
            echo "⚠️ OPENLIST_WEBHOOK 变量未设置"
          else
            curl -s "$OPENLIST_WEBHOOK"
          fi
      - name: Sync upstream repositories
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO_SYNC: ${{ vars.REPO_SYNC }}
        run: |
          if [ -z "$REPO_SYNC" ]
          then
            echo "❌ REPO_SYNC 变量未设置"
            exit 1
          fi
          
          echo "🔄 同步上游仓库..."
          echo "配置信息："
          echo "$REPO_SYNC"
          echo ""

          success_count=0
          fail_count=0

          while IFS= read -r line
          do
            line="${line//$'\r'/}"
            [ -z "$line" ] && continue

            if [[ $line =~ ^([^/]+)/([^:]+):(.+)$ ]]
            then
              owner="${BASH_REMATCH[1]}"
              repo="${BASH_REMATCH[2]}"
              branch="${BASH_REMATCH[3]}"
              
              echo "📦 同步中: $owner/$repo:$branch"

              response=$(curl -s -w "\n%{http_code}" -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/$owner/$repo/merge-upstream" \
                -d "{\"branch\":\"$branch\"}")

              http_code=$(echo "$response" | tail -n 1)
              body=$(echo "$response" | sed '$d')
              
              if [ "$http_code" = "200" ]
              then
                echo "✅ 成功: $owner/$repo"
                ((++success_count))
              else
                echo "❌ 失败: $owner/$repo (HTTP $http_code)"
                echo "   响应: $body"
                ((++fail_count))
              fi
            else
              echo "⚠️  格式错误，跳过: $line"
              echo "   预期格式: owner/repo:branch"
            fi
            
            echo ""
          done <<< "$REPO_SYNC"

          echo "================================"
          echo "同步完成！"
          echo "✅ 成功: $success_count"
          echo "❌ 失败: $fail_count"
          echo "================================"

          if [ $fail_count -gt 0 ]
          then
            exit 1
          fi
